# Overrides para desenvolvimento local — não commitar segredos
services:
  proxy:
    environment:
      - DOMAIN=localhost
      - IP_ALLOWLIST=0.0.0.0/0

  backend:
    # 8000 está ocupada por outro projeto (fastapi_app); o app real vai pelo proxy
    # na :80, este bind é só para acesso direto de debug.
    ports:
      - "8010:8000"
    environment:
      - APP_ENV=development

  worker:
    environment:
      - APP_ENV=development

  # Em dev, o npm run dev (porta 5173) é mais rápido para iterar.
  # O serviço frontend no Docker serve o build de produção em http://localhost
