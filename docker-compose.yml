services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - IP_ALLOWLIST=${IP_ALLOWLIST:-0.0.0.0/0}
    depends_on:
      - backend
      - frontend
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # O .env é montado como volume (não env_file): o pydantic-settings lê o
    # arquivo direto, sem a interpolação de '$' que o Docker Compose aplica em
    # env_file e que corrompe o hash Argon2 (ADMIN_PASSWORD_HASH).
    volumes:
      - ./.env:/app/.env:ro
      # Skills do Claude (~/.claude/skills) montadas em /skills para gerenciar/criar/editar.
      - ${CLAUDE_HOME:-./.claude}/skills:/skills:rw
      # Skills de plugins e do Claude Desktop (somente leitura — origem para importar).
      - ${CLAUDE_HOME:-./.claude}/plugins:/plugins:ro
      - "${CLAUDE_DESKTOP_SKILLS:-${CLAUDE_HOME:-./.claude}}:/desktop-skills:ro"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${CLAUDE_HOME:-~/.claude}:/home/user/.claude:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-workhub}
      - POSTGRES_USER=${POSTGRES_USER:-workhub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workhub}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
