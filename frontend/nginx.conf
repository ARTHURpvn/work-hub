server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — qualquer rota não encontrada serve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
